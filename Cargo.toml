[package]
name        = "rmap"
version     = "0.9.0"
edition     = "2024"
rust-version = "1.85"
description = "Minimal projection mapping tool — single-projector, single-machine, event-scale"
license     = "MIT OR Apache-2.0"

[[bin]]
name = "rmap"
path = "src/main.rs"

# NOTE: egui / egui-wgpu / egui-winit / wgpu / winit form a tightly coupled
# version set. Bump them in lockstep. Verify the matrix at
# https://github.com/emilk/egui#integrations before pinning new majors.
# Versions below were current at spec authoring; run `cargo update` and
# verify before first build.

[dependencies]
# Collections
# SmallVec is already a transitive dep (wgpu/winit pull it in at 1.15.1).
# We add it as a direct dep so we can use SmallVec in our own code.
smallvec = "1"

# GPU + windowing
winit = "0.30"
wgpu  = "29"

# Immediate-mode UI on the same wgpu device
egui       = "0.34"
egui-wgpu  = "0.34"
egui-winit = "0.34"

# Block on async wgpu calls without pulling in tokio
pollster = "0.4"

# Math
glam = { version = "0.32", features = ["serde"] }

# SVG rasterization (pure Rust, no native deps)
resvg     = "0.47"
usvg      = "0.47"
tiny-skia = "0.12"

# Image I/O for golden-image tests + asset handling
image = "0.25"

# Hot-reload file watching. `notify` is pulled in transitively; add a direct
# dep when the watcher implementation in `svg_layer.rs` actually uses
# notify::* types.
notify-debouncer-full = "0.7"

# Lock-free message passing for the off-thread SVG rasterization worker
crossbeam-channel = "0.5"

# CLI
clap = { version = "4", features = ["derive"] }

# Project-file (de)serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# P7.10.1 — Scene pack export / import (.rmap-scene-pack.zip).
# zip 2.x is pure Rust, no system deps, Apache-2.0/MIT.
zip = { version = "2", default-features = false, features = ["deflate"] }

# 003-T2.18 — operator preferences persistence (~/Library/Preferences/rmap.toml).
# Distinct from project save/load (serde_json) because the prefs file is a
# user-editable, OS-conventional config file; TOML is what the platform
# expects for that flavour of data.
toml = "1"

# Logging — daily rolling file appender lives behind tracing-appender
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender   = "0.2"

# Errors — typed at boundaries, contextual at top-level
thiserror = "2"
anyhow    = "1"

# M7 input-source crates. Each is gated behind its cargo feature so a default
# build (and the show-day release-show profile) doesn't pull them in.
cpal    = { version = "0.16", optional = true }
rustfft = { version = "6",    optional = true }
midir   = { version = "0.10", optional = true }
rosc    = { version = "0.11", optional = true }

# P5.1.4 — Phase 5 lighting output (Art-Net DMX). Gated behind `lighting`
# (off by default) so the show-day binary stays lean. MIT, pure Rust, zero
# system deps. Version matches the decision-doc ratification (P5.0.1).
artnet_protocol = { version = "0.4.4", optional = true }

# 003-T2.13 — native OS file picker. macOS uses NSOpenPanel / NSSavePanel
# directly; Linux falls back to xdg-portal (wayland-aware), Windows to the
# Win32 common dialogs. Default features include the Linux portal + wayland
# backends so rmap's dialogs work cross-platform out of the box; the macOS
# build path doesn't pull them in (no linux-specific deps on darwin).
rfd = "0.17"

# macOS-only: display-sleep prevention, App Nap suppression, monitor names.
# The objc2 family is the modern way to call Apple APIs from Rust; older
# `cocoa`/`objc` crates are deprecated. Sub-crate versions move together —
# bump them in lockstep.
[target.'cfg(target_os = "macos")'.dependencies]
objc2                  = "0.6"
objc2-foundation       = "0.3"
objc2-app-kit          = "0.3"
objc2-io-kit           = "0.3"
# V31.2.3 — UUID lookup for monitor identity across machines.
# `objc2-core-graphics` does not export `CGDisplayCreateUUIDFromDisplayID`
# (it lives in ColorSync / ApplicationServices, not CoreGraphics). We use
# `objc2-core-foundation` for the `CFUUID` and `CFString` types; the
# function itself is declared via a local `extern "C"` block linked against
# ApplicationServices (the same pattern winit-0.30 uses in its ffi.rs).
objc2-core-foundation  = { version = "0.3", features = ["CFUUID", "CFString"] }

# P0.4.2 — AVFoundation / VideoToolbox H.264 decoder, gated behind the
# `video` cargo feature (default-on). Each sub-crate enables only the
# feature flags actually used by the worker; the objc2 family generates
# stubs for disabled features so unused Apple APIs don't bloat the
# compilation graph.
objc2-av-foundation = { version = "0.3", optional = true, features = [
    "AVAsset",
    "AVAssetReader",
    "AVAssetReaderOutput",
    "AVAssetTrack",
    "AVMediaFormat",
    "objc2-core-media",
] }
objc2-core-media = { version = "0.3", optional = true, features = [
    "CMBase",
    "CMTime",
    "CMTimeRange",
    "CMSampleBuffer",
    "CMFormatDescription",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", optional = true, features = [
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }

[build-dependencies]
naga = { version = "29", features = ["wgsl-in"] }

[dev-dependencies]
# 003-T1.17: property-based testing for the Mutation Reverse-
# storage invariant. Test-only — does not touch release builds.
proptest = "1"

# Dev runtime: optimize dependencies but keep workspace code at -O0 for
# fast incremental compiles + debuggable symbols. wgpu / egui at opt=0
# are unusable for live iteration (single-digit fps); opt=1 for deps
# closes the gap without slowing the inner edit-recompile loop. First
# cold build is slower (deps compile with optimization once, then
# cached); every subsequent build benefits.
[profile.dev.package."*"]
opt-level = 1

# Show-day binary: longer compile, smaller artifact, no panic-unwind machinery.
# The renderer still uses `catch_unwind` for in-frame recovery before any
# eventual abort path is taken.
[profile.release-show]
inherits      = "release"
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

[features]
# P0.1.3 — `osc` and `midi` flip to default-on now that v0.4's binding
# picker (P0.2.3a/b/c) makes both transports operator-facing. `audio`
# stays opt-in because `cpal` adds a meaningful build cost. Opt out
# of any of them with `cargo build --no-default-features`.
default = ["osc", "midi", "video"]
# Enables the headless-wgpu golden-image tests; requires a working GPU adapter
# at test time. Off by default so plain `cargo test` stays CPU-only.
gpu-tests = []

# Live-input source dependencies. `osc` and `midi` are in `default`
# (above); `audio` ships behind a flag because `cpal` adds a
# meaningful build-time cost on first compile.
audio = ["dep:cpal", "dep:rustfft"]
midi  = ["dep:midir"]
osc   = ["dep:rosc"]

# P0.4.2 — AVFoundation video decoder. Default-on on macOS. When disabled
# (`--no-default-features`) the worker stub from Part 1 runs instead.
# The optional deps are macOS-only (declared in
# [target.'cfg(target_os = "macos")'.dependencies]); on non-macOS
# platforms the feature is effectively a no-op because the dep is
# absent, and `#[cfg(all(feature = "video", target_os = "macos"))]`
# gates all usage.
video = [
    "dep:objc2-av-foundation",
    "dep:objc2-core-media",
    "dep:objc2-core-video",
]

# Spec 003 UI/UX overhaul (state machine, command pattern, undo,
# project audit, launcher, canvas merge, ...). Off by default until
# M3 ships; lets the v2 UI continue running on `main` builds while
# v3 work ships behind the flag. Promoted to default-on at M3 per
# the 003 task plan.
v3 = []

# P5.1.4 — Phase 5 lighting output: Art-Net DMX transport, fixture groups,
# colour-from-pixel sampling. Off by default; mirrors `audio` / `midi` / `osc`.
# `cargo build --no-default-features` must succeed with this feature absent.
lighting = ["dep:artnet_protocol"]

# P7.2.1 — Syphon output: thin objc2 wrapper around the bundled Syphon.framework
# (BSD-licensed, ~800 KB, vendored in vendor/frameworks/). Off by default until
# the framework binary is vendor-committed (W2.1). macOS-only; also gate with
# `#[cfg(target_os = "macos")]` at every use site.
syphon-out = []
