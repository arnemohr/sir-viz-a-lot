  <!-- Center alignment cross: horizontal + vertical through (960, 540) -->
  <!-- Horizontal arm -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#ffffff" stroke-width="4"/>
  <!-- Vertical arm -->
  <line x1="960" y1="0" x2="960" y2="1080" stroke="#ffffff" stroke-width="4"/>

  <!-- Center circle: open circle at intersection for unambiguous center -->
  <circle cx="960" cy="540" r="24" fill="none" stroke="#ff3030" stroke-width="4"/>

  <!-- Corner markers: inward-pointing right-angle brackets (~5% = 96x54) -->
  <!-- TL corner: L-bracket opening toward inside (down + right) -->
  <path d="M 8 54 L 8 8 L 104 8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square"/>
  <!-- TR corner: L-bracket opening toward inside (down + left) -->
  <path d="M 1912 54 L 1912 8 L 1816 8" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square"/>
  <!-- BL corner: L-bracket opening toward inside (up + right) -->
  <path d="M 8 1026 L 8 1072 L 104 1072" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square"/>
  <!-- BR corner: L-bracket opening toward inside (up + left) -->
  <path d="M 1912 1026 L 1912 1072 L 1816 1072" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square"/>

</svg>
